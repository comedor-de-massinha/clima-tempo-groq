<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClimAI - Client Only</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #0b1220;
            --muted: #9ca3af;
            --text: #e5e7eb;
            --accent: #3b82f6;
            --input-bg: #071129;
            --border: #213547;
            --btn-bg: #06b6d4;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: sans-serif;
        }

        .weather-card {
            background: var(--card);
            border: 1px solid #1f2937;
        }

        .recommendation {
            background: var(--card);
            border-left: 5px solid var(--accent);
        }

        /* Custom scrollbar para o dropdown */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: var(--input-bg);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-2xl">
        <div class="flex justify-end mb-4">
            <a
                href="https://github.com/comedor-de-massinha/clima-tempo-groq"
                target="_blank"
                rel="noopener noreferrer"
                class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-slate-900 text-white border border-slate-700 hover:bg-slate-800 transition"
            >
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="h-5 w-5 fill-current">
                    <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.43 9.8 8.2 11.4.6.1.82-.26.82-.58 0-.29-.01-1.04-.02-2.04-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.33-1.76-1.33-1.76-1.09-.74.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.07 1.84 2.81 1.3 3.49 1 .11-.78.42-1.3.76-1.61-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 013.00-.4c1.02.01 2.05.14 3.00.40 2.29-1.55 3.30-1.23 3.30-1.23.65 1.65.24 2.87.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.6-2.81 5.62-5.48 5.92.42.36.82 1.10.82 2.22 0 1.60-.02 2.90-.02 3.29 0 .32.22.70.82.58C20.57 21.8 24 17.3 24 12c0-6.63-5.37-12-12-12z"/>
                </svg>
                GitHub
            </a>
        </div>
        <div class="text-center mb-8">
            <h1 class="text-4xl font-extrabold tracking-tight mb-1 text-gray-200">🌤️ ClimAI</h1>
            <p class="text-sm text-gray-400">Inteligência climática (Somente Cliente)</p>
        </div>

        <div class="flex flex-col sm:flex-row gap-3 mb-6 relative">
            
            <div class="relative flex-1">
                <input 
                    type="text" 
                    id="cidade-input" 
                    autocomplete="off"
                    placeholder="Digite para buscar qualquer cidade (Ex: São Paulo, Curitiba...)" 
                    class="w-full px-4 py-3 rounded-lg text-gray-200 placeholder-gray-500 outline-none transition-all duration-200"
                    style="background-color: var(--input-bg); border: 1px solid var(--border);"
                >
                
                <div 
                    id="js-suggestions" 
                    class="custom-scrollbar absolute left-0 right-0 z-50 mt-1 max-h-60 overflow-y-auto rounded-lg hidden shadow-2xl"
                    style="background-color: var(--input-bg); border: 1px solid var(--border);"
                ></div>
            </div>

            <button 
                id="btn-consultar" 
                class="px-6 py-3 rounded-lg font-semibold text-[#021424] transition-all hover:opacity-90 active:scale-95 whitespace-nowrap"
                style="background-color: var(--btn-bg);"
            >
                Consultar
            </button>
        </div>

        <div id="alert-zone" class="mb-4 hidden text-sm px-4 py-3 rounded-lg bg-yellow-500/10 border border-yellow-500/20 text-yellow-400"></div>

        <div id="resultado-container" class="space-y-4 hidden">
            
            <div class="weather-card p-6 rounded-2xl">
                <h2 id="res-cidade" class="text-2xl font-bold mb-4 text-gray-100">📍 Cidade</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm text-gray-300">
                    <p><b>🌡️ Temperatura:</b> <span id="res-temp">--</span>°C</p>
                    <p><b>🥵 Sensação térmica:</b> <span id="res-sensacao">--</span>°C</p>
                    <p><b>💧 Umidade:</b> <span id="res-umidade">--</span>%</p>
                    <p><b>🌬️ Vento:</b> <span id="res-vento">--</span> m/s</p>
                    <p class="sm:col-span-2"><b>☁️ Clima:</b> <span id="res-clima">--</span></p>
                </div>
            </div>

            <div class="recommendation p-5 rounded-xl">
                <h3 class="text-md font-semibold text-cyan-400 mb-2">📦 Raw API Response Body:</h3>
                <pre id="res-json" class="text-xs font-mono text-gray-400 bg-black/30 p-3 rounded-lg overflow-x-auto max-h-64 custom-scrollbar"></pre>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const input = document.getElementById('cidade-input');
            const suggestions = document.getElementById('js-suggestions');
            const btnConsultar = document.getElementById('btn-consultar');
            const alertZone = document.getElementById('alert-zone');
            const resultadoContainer = document.getElementById('resultado-container');

            let timer = null;
            let cidadeSelecionada = "";

            const WEATHER_CODE_MAP = {
                0: "Céu limpo", 1: "Principalmente limpo", 2: "Parcialmente nublado", 3: "Nublado",
                45: "Neblina", 48: "Depósitos de gelo", 51: "Chuvisco leve", 53: "Chuvisco moderado",
                55: "Chuvisco intenso", 56: "Chuvisco com gelo fino", 57: "Chuvisco intenso com gelo",
                61: "Chuva fraca", 63: "Chuva moderada", 65: "Chuva forte", 66: "Chuva gelada fraca",
                67: "Chuva gelada forte", 71: "Neve fraca", 73: "Neve moderada", 75: "Neve forte",
                77: "Granizo", 80: "Chuva pontual", 81: "Chuva pontual intensa", 82: "Chuva pontual muito intensa",
                85: "Neve fraca", 86: "Neve forte", 95: "Trovoada", 96: "Trovoada com granizo fraco",
                99: "Trovoada com granizo forte",
            };

            function showAlert(msg) {
                alertZone.textContent = msg;
                alertZone.classList.remove('hidden');
            }

            function hideAlert() {
                alertZone.classList.add('hidden');
            }

            // Gerencia o Dropdown enquanto o usuário digita
            input.addEventListener('input', function(e) {
                const q = e.target.value.trim();
                cidadeSelecionada = q; // Permite consultar mesmo se ele só digitar sem clicar

                if (timer) clearTimeout(timer);
                if (!q || q.length < 2) {
                    suggestions.classList.add('hidden');
                    return;
                }

                suggestions.classList.remove('hidden');
                suggestions.innerHTML = '<div class="p-3 text-sm text-gray-400 flex items-center"><svg class="animate-spin h-4 w-4 mr-2 text-cyan-400" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>Procurando cidades...</div>';

                timer = setTimeout(() => {
                    fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=pt`)
                    .then(r => r.json())
                    .then(data => {
                        const results = data.results || [];
                        if (results.length === 0) {
                            suggestions.innerHTML = '<div class="p-3 text-sm text-gray-400">Nenhum resultado encontrado</div>';
                            return;
                        }
                        suggestions.innerHTML = '';
                        results.forEach(r => {
                            const nome = r.name || '';
                            const estado = r.admin1 ? `, ${r.admin1}` : '';
                            const pais = r.country ? ` - ${r.country}` : '';
                            const label = nome + estado + pais;

                            const item = document.createElement('div');
                            item.className = 'p-3 text-sm text-gray-300 hover:bg-[#0b2a3a] cursor-pointer transition-colors text-left';
                            item.textContent = label;

                            item.addEventListener('click', function() {
                                input.value = label;
                                cidadeSelecionada = label;
                                suggestions.classList.add('hidden');
                            });
                            suggestions.appendChild(item);
                        });
                    })
                    .catch(() => {
                        suggestions.innerHTML = '<div class="p-3 text-sm text-red-400">Erro ao buscar resultados</div>';
                    });
                }, 300);
            });

            // Fecha se clicar fora do input ou do dropdown
            document.addEventListener('click', function(ev) {
                if (!input.contains(ev.target) && !suggestions.contains(ev.target)) {
                    suggestions.classList.add('hidden');
                }
            });

            // Reabre as sugestões se focar de volta com texto válido
            input.addEventListener('focus', function() {
                if (input.value.trim().length >= 2) suggestions.classList.remove('hidden');
            });

            // Ação do botão Consultar
            btnConsultar.addEventListener('click', function() {
                hideAlert();
                if (!cidadeSelecionada) {
                    showAlert("Por favor, selecione ou digite uma cidade primeiro.");
                    return;
                }

                btnConsultar.disabled = true;
                btnConsultar.textContent = "Consultando...";

                const cidadeLimpa = cidadeSelecionada.split(",")[0].trim();

                // Passo 1: Geocoding
                fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cidadeLimpa)}&count=1&language=pt`)
                .then(r => r.json())
                .then(geo => {
                    if (!geo.results || geo.results.length === 0) {
                        throw new Error("Cidade não encontrada pelo serviço de geocoding.");
                    }
                    const lat = geo.results[0].latitude;
                    const lon = geo.results[0].longitude;

                    // Passo 2: Clima
                    return fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&timezone=auto`);
                })
                .then(r => r.json())
                .then(data => {
                    const current = data.current || {};
                    
                    // Atualiza Interface Tratada
                    document.getElementById('res-cidade').textContent = `📍 ${cidadeSelecionada}`;
                    document.getElementById('res-temp').textContent = current.temperature_2m ?? '--';
                    document.getElementById('res-sensacao').textContent = current.temperature_2m ?? '--';
                    document.getElementById('res-umidade').textContent = current.relative_humidity_2m ?? '--';
                    document.getElementById('res-vento').textContent = current.wind_speed_10m ?? '--';
                    
                    const code = current.weather_code;
                    document.getElementById('res-clima').textContent = WEATHER_CODE_MAP[code] || "Condições climáticas";

                    // Alimenta o container com o Body cru da resposta da API
                    document.getElementById('res-json').textContent = JSON.stringify(data, null, 2);

                    // Mostra o container final
                    resultadoContainer.classList.remove('hidden');
                })
                .catch(err => {
                    showAlert(err.message || "Erro ao consultar informações.");
                })
                .finally(() => {
                    btnConsultar.disabled = false;
                    btnConsultar.textContent = "Consultar";
                });
            });
        })();
    </script>
</body>
</html>
